<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>айдентика</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600&family=Marck+Script&display=swap" rel="stylesheet">

<style>
  /* Шрифт для напису «Проєкти». Файл має лежати в папці fonts/ поруч із цією сторінкою */
  @font-face{
    font-family: "AnastasiaScript";
    src: url("fonts/AnastasiaScript.woff2") format("woff2"),   /* легший файл, вантажиться швидше */
         url("fonts/AnastasiaScript.ttf") format("truetype");  /* запасний для старих браузерів */
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --ink: #16181A;
    --muted: #63645C;
    --accent: #FF4B1F;
    --line: #E9A79A;              /* тонкі рожеві лінії над і під слайдером */
    --font: "Noto Sans", sans-serif;
    --script: "AnastasiaScript", "Marck Script", cursive;
  }
  *{ box-sizing: border-box; }
  html{
    scroll-behavior: smooth;
    background: #f1ecec; /* резервний фон, якщо Vanta не завантажиться */
  }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ transition-duration: .001ms !important; }
  }
  body{
    margin: 0;
    background: transparent !important;
    color: var(--ink);
    display: flow-root;
    min-height: 100vh;
    font-family: var(--font);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main{ background: transparent !important; }
  a{ color: inherit; }
  img{ display: block; max-width: 100%; }
  button{ font-family: inherit; cursor: pointer; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ===== ШАПКА (без змін) ===== */
  .bar{
    position: fixed; top: 16px; left: 16px; right: 16px; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .bar > *{ pointer-events: auto; }
  .bar-center{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    width: 15px;
    height: 15px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    color: #555;
  }
  .bar .back{
    background: #fff; padding: 2px 8px; border-radius: 2px;
    font-size: .9rem; text-decoration: none; color: var(--ink);
  }
  .bar-avatar{ position: relative; width: 85px; height: 85px; }
  .bar-avatar img{
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  }
  .bar-tag{
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    padding: 2px 8px;
    border-radius: 2px;
    font-size: .75rem;
    white-space: nowrap;
  }

  /* ===== Заголовок «Проєкти» ===== */
  .projects-head{
    padding: 120px 24px 36px;   /* 120px — щоб напис не ховався під шапкою */
    text-align: center;
  }
  .projects-title{
    margin: 0;
    font-family: var(--script);
    font-weight: 400;
    font-size: clamp(6rem, 22vw, 24rem);   /* розмір напису «Проєкти»: мін., залежно від ширини екрана, макс. */
    line-height: 1;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.12);
  }
  .scroll-down{
    display: inline-grid;
    place-items: center;
    width: 36px; height: 36px;
    margin-top: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,.6);
    color: var(--muted);
    transition: transform .25s ease, color .2s ease;
  }
  .scroll-down:hover{ transform: translateY(3px); color: var(--accent); }
  .scroll-down svg{ width: 18px; height: 18px; }

  /* ===== Слайдер проєктів ===== */
  .slider{
    position: relative;
    width: 100%;                 /* від краю до краю */
    aspect-ratio: 2 / 1;         /* пропорції блоку зі слайдами */
    max-height: 85vh;
    min-height: 420px;
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: #F5F3EC;         /* світлий фон під фото проєктів */
  }
  .slider__stage{
    position: absolute;
    inset: 6% 0;                 /* відступ фото проєкту від верху й низу блоку */
  }
  .slide{
    position: absolute;
    top: 0; left: 50%;
    height: 100%;
    width: auto;
    max-width: 70%;
    object-fit: contain;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity .5s ease;
  }
  .slide.is-active{ opacity: 1; }

  .slider__btn{
    position: absolute;
    top: 50%;
    z-index: 2;
    display: grid;
    place-items: center;
    width: clamp(40px, 4vw, 56px);
    height: clamp(40px, 4vw, 56px);
    padding: 0;
    border-radius: 50%;
    transform: translateY(-50%);
    transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .slider__btn svg{ width: 45%; height: 45%; }
  /* помаранчеві стрілки, як у макеті */
  .slider__btn--prev{
    left: 8%;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
  }
  .slider__btn--next{
    right: 8%;
    border: 1.5px solid var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .slider__btn:hover{
    background: #B23000;
    border-color: #B23000;
    color: #fff;
  }

  .after-space{ height: 140px; } /* порожнє місце під слайдером */

  @media (max-width: 600px){
    .bar{ top: 12px; left: 12px; right: 12px; }
    .bar-avatar{ width: 64px; height: 64px; }
    .bar-tag{ font-size: .68rem; }
    .projects-head{ padding-top: 96px; }
    .slider__btn--prev{ left: 4%; }
    .slider__btn--next{ right: 4%; }
    .slide{ max-width: 76%; }
  }
</style>
</head>
<body>

<div class="bar" id="bar">
  <a class="back" href="index.html#work">← Назад</a>
  <div class="bar-center">✢</div>
  <div class="bar-avatar">
    <img src="скриня.png" alt="Айдентика" width="85" height="85" decoding="async">
    <span class="bar-tag">айдентика</span>
  </div>
</div>

<main>
  <section class="projects-head">
    <h1 class="projects-title">Проєкти</h1>
    <a class="scroll-down" href="#slider" aria-label="Гортати до проєктів">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </section>

  <section class="slider" id="slider" aria-roledescription="carousel" aria-label="Проєкти айдентики">
    <!-- фото проєктів по центру. Щоб додати ще одне — скопіюй рядок <img class="slide"...> -->
    <div class="slider__stage">
      <img class="slide is-active" src="images/menu_a_1.png" alt="Айдентика, проєкт 1" fetchpriority="high" decoding="async">
      <img class="slide" src="images/menu_a_2.png" alt="Айдентика, проєкт 2" decoding="async">
      <img class="slide" src="images/menu_a_3.png" alt="Айдентика, проєкт 3" decoding="async">
      <img class="slide" src="images/menu_a_4.png" alt="Айдентика, проєкт 4" decoding="async">
      <img class="slide" src="images/menu_a_5.png" alt="Айдентика, проєкт 5" decoding="async">
      <img class="slide" src="images/menu_a_6.png" alt="Айдентика, проєкт 6" decoding="async">
    </div>

    <button class="slider__btn slider__btn--prev" type="button" aria-label="Попередній проєкт">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="slider__btn slider__btn--next" type="button" aria-label="Наступний проєкт">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <div class="after-space"></div>
</main>

<script>
  /* Перемикання проєктів: стрілки, клавіші ← →, свайп на телефоні */
  (function(){
    "use strict";
    var slider = document.getElementById("slider");
    if (!slider) return;
    var slides = slider.querySelectorAll(".slide");
    var prev = slider.querySelector(".slider__btn--prev");
    var next = slider.querySelector(".slider__btn--next");
    var i = 0;

    slides.forEach(function(s, n){ if (n !== 0) s.setAttribute("aria-hidden", "true"); });

    function show(n){
      slides[i].classList.remove("is-active");
      slides[i].setAttribute("aria-hidden", "true");
      i = (n + slides.length) % slides.length;   /* по колу: після 6-го знову 1-й */
      slides[i].classList.add("is-active");
      slides[i].removeAttribute("aria-hidden");
    }

    prev.addEventListener("click", function(){ show(i - 1); });
    next.addEventListener("click", function(){ show(i + 1); });

    slider.addEventListener("keydown", function(e){
      if (e.key === "ArrowLeft") show(i - 1);
      if (e.key === "ArrowRight") show(i + 1);
    });

    var x0 = null;
    slider.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, { passive: true });
    slider.addEventListener("touchend", function(e){
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 40) show(dx < 0 ? i + 1 : i - 1);
      x0 = null;
    });
  })();
</script>

<!-- Three.js та Vanta.js (Fog) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  if (!window.VANTA || !window.THREE) return;

  const fogEffect = VANTA.FOG({
    el: "body",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200.00,
    minWidth: 200.00,
    highlightColor: 0xffffff,
    midtoneColor: 0xc3beba,
    lowlightColor: 0x91415e,
    baseColor: 0xffffff,
    blurFactor: 0.45,
    speed: 0.5,
    zoom: 1.28
  });

  window.addEventListener('pagehide', () => {
    if (fogEffect && typeof fogEffect.destroy === 'function') fogEffect.destroy();
  }, { once: true });
});
</script>
</body>
</html>
